<html lang="en">
<head>
    <title>Document</title>

<body>
    <style>
        * {
            padding: 0px;
            margin: 0px;
            border: 0px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: normal;
        }

        .contenedor {
            width: 90%;
            margin: 0 auto;
            background-color: rgb(231, 145, 95);
            padding: .5rem;
            text-align: center;
        }

        .tarjeta {
            padding: 1rem;
            width: 350px;
            background-color: rgba(209, 241, 64, 0.918);
            display: inline-block;
            border-radius: 10px;
            margin-bottom: .25rem;
        }

        .tarjeta{
            text-decoration: none;
            font-size: 12px;
        }

        .tarjeta a{
          text-decoration: none;
          font-size: 12px;
        }
        a:hover{
          text-decoration: underline;
        }
        
        .tarjeta h5 {
            font-style: italic;
            margin-bottom: .25rem;
        }

    </style>

    <div class="contenedor">
        <div class="tarjeta">
            <h4>Lucero Meneses</h4>

            <a href="tel:956111222">Contactar</a>
            <a href="mailto:001661025a@senati.pe">Enviar correo</a>
        </div>
    </div>    

    <script>
      /* Imaginemos que los datos para las tarjetas vienen de una consulta */

      const contenedor = document.querySelector(".contenedor") //. =clase
      //continuamos..

      function renderizarTarjetas(){
      contenedor.innerHTML = ''

            <a href="mailto:${alumno.correo}">Enviar correo</a>
        </div>
        `

        contenedor.innerHTML += nuevatarjeta
        
      })
    }

    renderizarTarjetas()
