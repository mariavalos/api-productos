<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <style>
   /* como aplicaria los estilos Bootstrap/bulma */
    .importante {
      text-align: center;
      display:block;
      font-weight: bold;
      font-size: 24px;
      color: rgb(58, 122, 240);
      text-shadow: 0px 0px 2px gray;
    }



    /* como funciona tailwind */
    .centrado {text-align: center;}
    .ancho { display: block; }
    .texto { font-weight: bold;}
    .texto-md { font-size: 24px;}
    .color-blue { color: rgb(58, 122, 240);}
    .color-red { color: rgb(255, 0, 0);}
    .sombra { text-shadow: 0px 0px 2px gray;}
  </style>


  <span class="importante">Ingenieria de Software</span>
  <span class="centrado ancho texto texto-md color-blue sombra">Jhon Francia Minaya</span>
  <span class="centrado ancho texto texto-md color-red">Hola mundo cruel</span>

</body>
</html>
